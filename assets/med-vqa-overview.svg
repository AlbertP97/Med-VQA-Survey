<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Med-VQA Survey: de la imagen médica al análisis</title>
  <desc id="desc">Ilustración conceptual de una imagen médica, una pregunta y una respuesta, junto a nueve benchmarks analizados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10253f"/>
      <stop offset="1" stop-color="#174e64"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6f4f1"/>
      <stop offset="1" stop-color="#71c9d1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071522" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="60" r="130" fill="#55c4bd" opacity=".09"/>
  <circle cx="175" cy="420" r="180" fill="#75d9cf" opacity=".06"/>
