    <text x="64" y="132" fill="#ffffff" font-size="38" font-weight="700">De la imagen a la pregunta.</text>
    <text x="64" y="174" fill="#d3e6ee" font-size="19">Nueve benchmarks, explorados con estadísticas y visualizaciones.</text>
    <g transform="translate(64 224)">
