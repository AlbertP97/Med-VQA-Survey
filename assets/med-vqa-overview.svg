      <path d="M88 72h74M91 87h67M99 102h51" stroke="#d7ffff" stroke-width="2" opacity=".5"/>
      <circle cx="125" cy="78" r="48" fill="none" stroke="#8ddbd6" stroke-width="1" opacity=".45"/>
      <text x="28" y="158" fill="#e6f4f5" font-size="12" font-weight="700" letter-spacing="1.5">IMAGEN MÉDICA</text>
    </g>
    <path d="M337 293h74m-12-12 12 12-12 12" fill="none" stroke="#82d9d2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(438 236)">
      <rect width="310" height="87" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <path d="M28 87l15 16 15-16" fill="#ffffff"/>
      <circle cx="33" cy="34" r="5" fill="#36a6a6"/>
      <circle cx="49" cy="34" r="5" fill="#36a6a6" opacity=".62"/>
      <circle cx="65" cy="34" r="5" fill="#36a6a6" opacity=".34"/>
      <text x="28" y="66" fill="#18354b" font-size="17" font-weight="600">¿Qué muestra la imagen?</text>
      <text x="28" y="129" fill="#d2e8eb" font-size="12" font-weight="700" letter-spacing="1.5">PREGUNTA</text>
    </g>
    <path d="M769 293h64m-12-12 12 12-12 12" fill="none" stroke="#82d9d2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
